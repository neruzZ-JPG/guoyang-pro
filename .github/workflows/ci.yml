name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Pack and verify installed CLI
        run: |
          TGZ=$(npm pack --ignore-scripts --silent | tail -n 1)
          INSTALL_DIR="$RUNNER_TEMP/guoyang-install"
          npm install --ignore-scripts --prefix "$INSTALL_DIR" "$PWD/$TGZ"
          "$INSTALL_DIR/node_modules/.bin/guoyang-pro" version
          HOME="$RUNNER_TEMP/guoyang-home" "$INSTALL_DIR/node_modules/.bin/guoyang-pro" selftest

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
